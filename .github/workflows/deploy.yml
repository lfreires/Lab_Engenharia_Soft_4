name: Deploy Cloud Run

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGION: us-central1

jobs:
  deploy-staging:
    name: Deploy staging (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT" ]; then
            echo "GCP_PROJECT_ID nao definido (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          IMAGE="us-central1-docker.pkg.dev/${PROJECT}/livraria/api:${{ github.sha }}"
          LATEST="us-central1-docker.pkg.dev/${PROJECT}/livraria/api:latest"

          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Deploy staging service
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT" ]; then
            echo "GCP_PROJECT_ID nao definido (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          IMAGE="us-central1-docker.pkg.dev/${PROJECT}/livraria/api:${{ github.sha }}"
          SERVICE="livraria-api-staging"
          RUNTIME_SA="livraria-api-runtime@${PROJECT}.iam.gserviceaccount.com"

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --concurrency 80 \
            --memory 512Mi \
            --cpu 1 \
            --service-account "$RUNTIME_SA" \
            --update-secrets JWT_SECRET=livraria-jwt-secret:latest \
            --set-env-vars "^|^APP_ENV=staging|PERSISTENCE_BACKEND=firestore|FIRESTORE_PROJECT_ID=${PROJECT}|FIRESTORE_DATABASE=firabase-livraria|LOG_LEVEL=INFO|CORS_ALLOWED_ORIGINS=https://lab-engenharia-soft-4.vercel.app,http://localhost:3000,http://localhost:8080"

  deploy-production:
    name: Deploy production (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT" ]; then
            echo "GCP_PROJECT_ID nao definido (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          IMAGE="us-central1-docker.pkg.dev/${PROJECT}/livraria/api:${{ github.sha }}"
          LATEST="us-central1-docker.pkg.dev/${PROJECT}/livraria/api:latest"

          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Deploy production service
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT" ]; then
            echo "GCP_PROJECT_ID nao definido (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          IMAGE="us-central1-docker.pkg.dev/${PROJECT}/livraria/api:${{ github.sha }}"
          SERVICE="livraria-api-prod"
          RUNTIME_SA="livraria-api-runtime@${PROJECT}.iam.gserviceaccount.com"

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --concurrency 80 \
            --memory 512Mi \
            --cpu 1 \
            --service-account "$RUNTIME_SA" \
            --update-secrets JWT_SECRET=livraria-jwt-secret:latest \
            --set-env-vars "^|^APP_ENV=production|PERSISTENCE_BACKEND=firestore|FIRESTORE_PROJECT_ID=${PROJECT}|FIRESTORE_DATABASE=firabase-livraria|LOG_LEVEL=INFO|CORS_ALLOWED_ORIGINS=https://lab-engenharia-soft-4.vercel.app,http://localhost:3000,http://localhost:8080"
