name: Build and Push Image

on:
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  build-push:
    name: Build Docker image to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push image
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT" ]; then
            echo "GCP_PROJECT_ID nao definido (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          IMAGE_PATH="us-central1-docker.pkg.dev/${PROJECT}/livraria/api"
          docker build \
            --tag "${IMAGE_PATH}:${{ github.sha }}" \
            --tag "${IMAGE_PATH}:latest" \
            --label "git-commit=${{ github.sha }}" \
            --label "git-ref=${{ github.ref_name }}" \
            .
          docker push "${IMAGE_PATH}:${{ github.sha }}"
          docker push "${IMAGE_PATH}:latest"

      - name: Output image refs
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}"
          IMAGE_PATH="us-central1-docker.pkg.dev/${PROJECT}/livraria/api"
          echo "Image pushed:"
          echo "  ${IMAGE_PATH}:${{ github.sha }}"
          echo "  ${IMAGE_PATH}:latest"
