[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["livraria*"]

[project]
name = "livraria"
version = "0.1.0"
description = "Sistema de livraria — Clean Architecture + API REST"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "google-cloud-firestore>=2.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Excluir: código legado Tkinter, scripts de exemplo, migrations auto-geradas
exclude = [
    "app.py",
    "example.py",
    "alembic/",
    "livraria/views/",
    "livraria/infrastructure/repositories_txt/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "unit: testes unitários (sem I/O externo)",
    "integration: testes de integração (banco, API)",
]

[tool.coverage.run]
omit = [
    "livraria/views/*",
    "livraria/controllers/*",
    "livraria/infrastructure/repositories_txt/*",
    "livraria/infrastructure/unit_of_work_txt.py",
]

[tool.coverage.report]
omit = [
    "livraria/views/*",
    "livraria/controllers/*",
    "livraria/infrastructure/repositories_txt/*",
    "livraria/infrastructure/unit_of_work_txt.py",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
