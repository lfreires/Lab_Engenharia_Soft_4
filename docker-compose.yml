services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livraria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livraria_dev}
      POSTGRES_DB: livraria
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livraria"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://livraria:${POSTGRES_PASSWORD:-livraria_dev}@db:5432/livraria
      JWT_SECRET: ${JWT_SECRET:-change-me-insecure-dev-only}
      JWT_EXPIRES_MINUTES: 60
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    # Executa migrations antes de subir o servidor
    command: >
      sh -c "alembic upgrade head &&
             uvicorn livraria.api.main:app --host 0.0.0.0 --port 8080 --no-access-log"

volumes:
  postgres_data:
